name: Backend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: url-shortener-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: url-shortener-backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand || true
      - run: npm run build

  backend-image:
    needs: backend-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./url-shortener-backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/url-shortener-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/url-shortener-backend:${{ github.sha }}

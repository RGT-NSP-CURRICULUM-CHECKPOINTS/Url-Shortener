name: Deploy

on:
  workflow_dispatch:  # Manual trigger until you're ready for auto-deploy
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/url-shortener
            docker-compose pull
            docker-compose up -d
            docker-compose ps